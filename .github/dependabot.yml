# Read by Dependabot from master. Version PRs go through development/revision;
# security updates keep GitHub's separate default-branch handling and PR limit.
# Routine compatible updates travel together; majors remain individual reviews.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /docs
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    groups:
      docs-routine:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Warsaw
    # Three currently blocked individual updates must leave room for a routine group.
    open-pull-requests-limit: 4
    groups:
      npm-routine:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    groups:
      docker-routine:
        patterns: ["*"]
        update-types: [minor, patch]
# No docker-compose updater until this repository has a Compose manifest.
