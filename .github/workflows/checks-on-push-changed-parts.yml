# The quick check of a push to development or a contributor's branch: only the parts
# of checks-reusable-set.yml that what was pushed touches (code, docs). Everything
# runs on revision and on pull requests.
name: "checks › on push to development and dev/**: only the changed parts"

on:
  push:
    branches: [development, "dev/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.what.outputs.code }}
      docs: ${{ steps.what.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: go-task/setup-task@v2
      - name: What the push changed
        id: what
        run: task workflows:changes -- "${{ github.event.before }}"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/checks-reusable-set.yml
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}
