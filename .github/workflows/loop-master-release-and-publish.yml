# Every push to master releases (decision Q10): the merged pull request revision →
# master (opened by loop-revision-bump-checks-pull-request.yml), a person's merge. In order:
#   1. checks; a version reaching master already released gets the patch (a hotfix)
#   2. tag v<version> and the GitHub release (skipped when that tag exists)
#   3. the dev community hears of it (Discord, Telegram); the release gets the package's
#      file, the release `latest` moves to it, VirusTotal scans its files
#   4. published, each by its own workflow: npm on npmjs.org and on GitHub Packages
#      (pre-releases too); a full release only: the container image on Docker Hub and
#      ghcr.io. In parallel the docs: Read the Docs activates and builds the tag, the
#      GitHub wiki is synced
#   5. social media hear of it
#   6. master goes back into development, and the listening BOS workshop is called
# Every step that is more than one command is a script in scripts/workflows/, run as
# `task workflows:<name>` (readable and runnable by hand). Every outward call runs only
# when its secret is set (docs/architecture/workflows.md lists them); publishing ones
# come from the environment publish-env.
name: "loop › master: release, publish, docs, back into development"

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  HUSKY: "0"
  # decision Q7: npm `next` (a GitHub pre-release) until phase 2 is done
  PRERELEASE: "true"

jobs:
  checks:
    uses: ./.github/workflows/checks-reusable-set.yml
    with: { code: true, docs: true, package: true }

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ env.PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: master, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: go-task/setup-task@v1
      - name: Hotfix bump (a released version reaching master)
        run: task workflows:bump -- master "hotfix on master"
      - name: Tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: task workflows:release -- ${{ env.PRERELEASE == 'true' && '--prerelease' || '' }}

  community:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: go-task/setup-task@v1
      - run: task workflows:notify -- community "${{ needs.release.outputs.tag }}"

  files:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    environment: publish-env
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      PRERELEASE: ${{ needs.release.outputs.prerelease }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.release.outputs.tag }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: go-task/setup-task@v1
      - run: npm ci
      - name: The package's file
        id: pack
        run: task workflows:pack -- "$RUNNER_TEMP/files"
      - name: The file into the release
        run: gh release upload "$TAG" "${{ steps.pack.outputs.file }}" --clobber
      - name: The release latest, moved here
        run: >-
          task workflows:rolling-release -- latest "$TAG" "$PRERELEASE"
          "The last published release, $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG - it moves with every release."
          "${{ steps.pack.outputs.file }}"
      - name: Every file of the release to VirusTotal
        run: task workflows:virustotal -- "$TAG"

  publish:
    needs: release
    if: needs.release.outputs.tag
    uses: ./.github/workflows/npmjs-npm-package-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  github-npm:
    needs: release
    if: needs.release.outputs.tag
    uses: ./.github/workflows/github-npm-package-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      prerelease: ${{ needs.release.outputs.prerelease == 'true' }}
    permissions:
      contents: read
      packages: write

  docker-hub:
    needs: release
    if: needs.release.outputs.tag && needs.release.outputs.prerelease != 'true'
    uses: ./.github/workflows/docker-container-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  ghcr:
    needs: release
    if: needs.release.outputs.tag && needs.release.outputs.prerelease != 'true'
    uses: ./.github/workflows/github-container-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: read
      packages: write

  readthedocs:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    environment: publish-env
    env:
      READTHEDOCS_API_TOKEN: ${{ secrets.READTHEDOCS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: go-task/setup-task@v1
      - if: env.READTHEDOCS_API_TOKEN != ''
        run: task workflows:readthedocs -- "${{ needs.release.outputs.tag }}"

  wiki:
    needs: release
    if: needs.release.outputs.tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.release.outputs.tag }}" }
      - uses: astral-sh/setup-uv@v6
      - uses: go-task/setup-task@v1
      - run: task workflows:wiki -- "${{ needs.release.outputs.tag }}"

  social:
    needs: [release, files, publish, github-npm, docker-hub, ghcr, readthedocs, wiki]
    if: ${{ !cancelled() && needs.release.outputs.tag }}
    runs-on: ubuntu-latest
    env:
      SOCIAL_WEBHOOK: ${{ secrets.SOCIAL_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: go-task/setup-task@v1
      - run: task workflows:notify -- social "${{ needs.release.outputs.tag }}"

  back:
    # after everything of the release, whatever it ended with; pull development after it
    needs: [release, community, files, publish, github-npm, docker-hub, ghcr, readthedocs, wiki, social]
    if: ${{ !cancelled() && needs.release.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BOS_WORKSHOP_HOOK: ${{ secrets.BOS_WORKSHOP_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: go-task/setup-task@v1
      - name: master back into development
        run: task workflows:merge-into -- origin/master development
      - name: Call the listening BOS workshop
        run: task workflows:notify -- workshop "${{ needs.release.outputs.tag }}"
