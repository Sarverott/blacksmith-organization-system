# The same gate as `task check`, on every push and pull request of the loop's branches.
name: check

on:
  push:
    branches: [development, "dev/**", revision, testing, releasing, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: "0"
      - run: npm run check
      - run: npm run build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project docs mkdocs build --strict -f docs/mkdocs.yml
        env:
          NO_MKDOCS_2_WARNING: "1"
