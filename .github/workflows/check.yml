# The quick check of a push to development or a contributor's branch: only the parts
# of checks.yml that what was pushed touches (code, docs). Everything runs on pull
# requests (pr-checks.yml).
name: check

on:
  push:
    branches: [development, "dev/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.what.outputs.code }}
      docs: ${{ steps.what.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: go-task/setup-task@v1
      - name: What the push changed
        id: what
        run: task workflows:changes -- "${{ github.event.before }}"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      code: ${{ needs.changes.outputs.code == 'true' }}
      docs: ${{ needs.changes.outputs.docs == 'true' }}
