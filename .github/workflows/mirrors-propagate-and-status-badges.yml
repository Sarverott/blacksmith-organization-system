# The source (this GitHub repository) synced to its mirrors - gitea.com, gitlab.com,
# bitbucket.org, sr.ht (.github/bos.json: mirrors) - every branch and tag, deletions too;
# then one status badge per place on the branch `badges`, shown in the READMEs:
#   "github.com source: 200 OK"   "gitea.com mirror: 200 OK | 404 NOT_FOUND | 403 FORBIDDEN"
# Runs on a push to development (and by hand), the branch where work lands. It never
# interrupts the work: a mirror that fails shows 403 FORBIDDEN on its badge and an error
# in the run, but the run passes. Mirrors only receive: their own CI runs checks, never
# publishes (the owner, phase 2). Steps: scripts/workflows/mirrors.sh, status-badges.sh.
name: "mirrors › sync the source on development, status badges"

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

# the newest state wins: a run still pushing an older one is cancelled
concurrency:
  group: mirrors
  cancel-in-progress: true

jobs:
  mirrors:
    runs-on: ubuntu-latest
    environment: publish-env
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: go-task/setup-task@v2
      - name: Every branch and tag to each mirror, a badge each
        # a mirror's failure is on its badge and in the log; the work goes on
        continue-on-error: true
        env:
          MIRROR_GITEA_TOKEN: ${{ secrets.MIRROR_GITEA_TOKEN }}
          MIRROR_GITLAB_TOKEN: ${{ secrets.MIRROR_GITLAB_TOKEN }}
          MIRROR_BITBUCKET_TOKEN: ${{ secrets.MIRROR_BITBUCKET_TOKEN }}
          MIRROR_SOURCEHUT_SSH_KEY: ${{ secrets.MIRROR_SOURCEHUT_SSH_KEY }}
        run: task workflows:mirrors -- "$RUNNER_TEMP/badges"
      - name: The badges, on the branch badges
        run: task workflows:status-badges -- "$RUNNER_TEMP/badges"
