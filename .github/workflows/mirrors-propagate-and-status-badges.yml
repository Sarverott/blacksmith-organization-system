# The source (this GitHub repository) propagated to its mirrors - gitea.com, gitlab.com,
# bitbucket.org, sr.ht (.github/bos.json: mirrors) - every branch and tag, deletions too;
# then one status badge per place on the branch `badges`, shown in the READMEs:
#   "github.com source: 200 OK"   "gitea.com mirror: 200 OK | 404 NOT_FOUND | 403 FORBIDDEN"
# A mirror whose update fails shows 403 FORBIDDEN and fails this run.
# Pushes made by the workflows' own token start no workflow, so the loop's runs and a
# daily run catch what they pushed. Steps: scripts/workflows/mirrors.sh, status-badges.sh.
name: "mirrors › propagate the source, status badges"

on:
  push:
    branches: ["**", "!badges"]
    tags: ["**"]
  delete:
  workflow_run:
    workflows:
      - "loop › revision: checks, authors, bump, pull request to master"
      - "loop › master: release, publish, docs, back into development"
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# the newest state wins: a run still pushing an older one is cancelled
concurrency:
  group: mirrors
  cancel-in-progress: true

jobs:
  mirrors:
    runs-on: ubuntu-latest
    environment: publish-env
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: go-task/setup-task@v1
      - name: Every branch and tag to each mirror, a badge each
        env:
          MIRROR_GITEA_TOKEN: ${{ secrets.MIRROR_GITEA_TOKEN }}
          MIRROR_GITLAB_TOKEN: ${{ secrets.MIRROR_GITLAB_TOKEN }}
          MIRROR_BITBUCKET_TOKEN: ${{ secrets.MIRROR_BITBUCKET_TOKEN }}
          MIRROR_SOURCEHUT_SSH_KEY: ${{ secrets.MIRROR_SOURCEHUT_SSH_KEY }}
        run: task workflows:mirrors -- "$RUNNER_TEMP/badges"
      - name: The badges, on the branch badges
        if: success() || failure()
        run: task workflows:status-badges -- "$RUNNER_TEMP/badges"
