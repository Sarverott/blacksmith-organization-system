# Publishes the package to npmjs.org: called by loop-master-release-and-publish.yml for
# every release, or run when a person creates a GitHub release. A pre-release goes under the npm tag `next`
# (decision Q7: until phase 2 is done), a release under `latest`. The token is NPM_TOKEN
# of the environment publish-env; without it, it says so and stops.
# Steps: scripts/workflows/publish.sh (task workflows:publish).
name: "publish › npm package to npmjs.org (pre-releases under next)"

on:
  workflow_call:
    inputs:
      tag:
        description: the git tag to publish, e.g. v1.0.0
        type: string
        required: true
      prerelease:
        type: boolean
        default: true
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: the git tag to publish, e.g. v1.0.0
        type: string
        required: true
      prerelease:
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish-env
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.event.release.tag_name }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - uses: go-task/setup-task@v1
      - run: npm ci
      - run: task workflows:publish -- npmjs ${{ (inputs.prerelease || github.event.release.prerelease) && 'next' || 'latest' }}
