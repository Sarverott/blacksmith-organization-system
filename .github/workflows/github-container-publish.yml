# as package container: https://github.com/Sarverott/blacksmith-organization-system/packages
# only stable LTS full release
#
# Builds the Dockerfile of a release's tag (the bos command, see Dockerfile) and pushes
# it to GitHub's container registry (ghcr.io/sarverott/blacksmith-organization-system),
# with the workflow's own token (packages: write).
# Only a full release: called by loop-master-release-and-publish.yml when the release
# is not a pre-release; by hand with a tag, its GitHub release is checked the same way.
# Tags: <version>, <major>.<minor>, latest. "LTS" is open (BRAINSTORM Q12): for now
# every full release counts.
name: "publish › container image to GitHub Packages, ghcr.io (full releases only)"

on:
  workflow_call:
    inputs:
      tag:
        description: the git tag of a full release, e.g. v1.2.0
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: the git tag of a full release, e.g. v1.2.0
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ github.token }}
      USERNAME: ${{ github.actor }}
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ inputs.tag }}" }
      - uses: go-task/setup-task@v1
      - name: Only a full release, with a token
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: task workflows:image-gate -- "${{ inputs.tag }}"
      - if: steps.gate.outputs.go == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.gate.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ env.TOKEN }}
      - if: steps.gate.outputs.go == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.gate.outputs.namespace }}/blacksmith-organization-system
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
            type=raw,value=latest
      - if: steps.gate.outputs.go == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
