# Work landed on revision (the routine: an agent pushes development to revision when it
# stops for the owner). Bumps the version as .github/bos.json says (default: minor), but
# only a released one, and brings the bump back into development: pull it.
name: revision

on:
  push:
    branches: [revision]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revision
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: revision, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: go-task/setup-task@v1
      - name: Bump and push to revision
        id: bump
        run: task workflows:bump -- revision "landed on revision"
      - name: The bump into development
        if: steps.bump.outputs.bumped == 'true'
        run: task workflows:merge-into -- revision development
