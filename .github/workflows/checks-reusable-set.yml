# Every check of the core, one job each, so a run can take only the part it needs.
# Called by checks-on-push-changed-parts.yml (what a push changed),
# checks-on-pull-request-then-automerge.yml, loop-revision-bump-checks-pull-request.yml
# and loop-master-release-and-publish.yml (everything); started by hand it runs everything.
name: "checks › reusable set: types, lint, tests, build, package, docs, dependencies, commits"

on:
  workflow_call:
    inputs:
      code:
        description: types, lint, tests, build
        type: boolean
        default: true
      docs:
        description: the MkDocs site, --strict
        type: boolean
        default: true
      package:
        description: what npm would publish
        type: boolean
        default: false
      commits:
        description: "commit messages from this commit (exclusive) to HEAD, never older than commitlint; empty: not checked"
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  types:
    if: inputs.code || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  lint:
    if: inputs.code || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint

  tests:
    if: inputs.code || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test

  build:
    if: inputs.code || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build

  package:
    if: inputs.package || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: go-task/setup-task@v2
      - run: task workflows:package

  dependencies:
    if: inputs.code || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high

  docs:
    if: inputs.docs || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: bash scripts/workflows/docs-lock.sh
      - run: python3 scripts/workflows/test_docs_lock.py
      - run: uv run --locked --project docs mkdocs build --strict -f docs/mkdocs.yml
        env:
          NO_MKDOCS_2_WARNING: "1"

  commits:
    if: inputs.commits != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: go-task/setup-task@v2
      - run: task workflows:commits -- "${{ inputs.commits }}"
