# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Procedures of the BOS core. Every workmode will be a set of these tasks (phase 3).

version: '3'

includes:
  hooks: ./.husky/Taskfile.yml
  devlog:
    taskfile: ./docs/devlog/Taskfile.yml
    dir: ./docs/devlog

vars:
  BOS: node {{.ROOT_DIR}}/src/cli.ts

tasks:
  default:
    desc: List the tasks
    cmds: [task --list]
    silent: true

  install:
    desc: Install the dependencies and the git hooks
    cmds: [npm install]

  check:
    desc: Everything CI checks - types, lint, tests
    cmds: [npm run check]

  test:
    desc: Run the tests (temporary workshops only), e.g. task test -- watching
    cmds: ['npx vitest run {{.CLI_ARGS}}']

  format:
    desc: Format and fix what biome can
    cmds: [npm run format]

  build:
    desc: Compile src/ into dist/
    cmds: [npm run build]

  commit:
    desc: Commit with guided prompts (commitizen, commitlint rules)
    interactive: true
    cmds: [npx cz]

  bos:
    desc: 'Run the bos CLI from source, e.g. task bos -- scope version blacksmith-organization-system'
    cmds: ['{{.BOS}} {{.CLI_ARGS}}']

  status:
    desc: Inspect the whole workshop (reads only); task status -- --all shows notes too
    cmds: ['{{.BOS}} workshop status {{.CLI_ARGS}}']

  bootstrap:
    desc: Create what is missing in the workshop; task bootstrap -- --dry-run only plans
    cmds: ['{{.BOS}} workshop bootstrap {{.CLI_ARGS}}']

  watch:
    desc: Listen to changes in the workshop until Ctrl+C; task watch -- --record keeps them in storylines
    interactive: true
    cmds: ['{{.BOS}} workshop watch {{.CLI_ARGS}}']
