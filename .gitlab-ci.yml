# On the gitlab.com mirror (GitLab CI). The source is GitHub; this repository only
# receives it (.github/workflows/mirrors-propagate-and-status-badges.yml).
# The same checks as GitHub's (task check): types, lint, tests.
checks:
  image: node:24
  variables:
    HUSKY: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "development"
  cache:
    key: npm
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run check
