# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Tasks of the devlog. Included by the root Taskfile as `devlog:` (runs in this directory).

version: '3'

tasks:
  state:
    desc: Write STATE.md - phases of TODO.md, open questions and proposals, waiting orders
    cmds:
      - node {{.ROOT_DIR}}/src/cli.ts devlog state --write

  scrapnote:
    desc: 'Start a scrapnote named by the current moment, e.g. task devlog:scrapnote -- "flow engine"'
    cmds:
      - |
        UNIXUSAT=$(node -e 'console.log(Date.now())')
        printf '# %s\n\n> UNIXUSAT=%s\n\n' "{{.CLI_ARGS | default "scrapnote"}}" "$UNIXUSAT" > "scrapnote-$UNIXUSAT.md"
        echo "scrapnote-$UNIXUSAT.md"
