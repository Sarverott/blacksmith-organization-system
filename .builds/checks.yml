# On the sr.ht mirror (builds.sr.ht runs every manifest in .builds/ on each push; it needs
# a paid sourcehut account). The source is GitHub; this repository only receives it.
# The same checks as GitHub's (task check): types, lint, tests.
image: alpine/edge
packages:
  - nodejs-current
  - npm
sources:
  - https://git.sr.ht/~sarverott/blacksmith-organization-system
environment:
  HUSKY: "0"
tasks:
  - checks: |
      cd blacksmith-organization-system
      npm ci
      npm run check
